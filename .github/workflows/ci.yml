name: KMP CI - Build & Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-and-build:
    name: Build & Test (Multiplatform)
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Verify Shared KMP Module Compilation
        run: ./gradlew :shared:assemble

      - name: Run Unit Tests
        run: ./gradlew test

      - name: Build Android Debug App
        run: ./gradlew :app:assembleDebug
